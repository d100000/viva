# Single-host/Beta reference only. Production can replace this with a managed
# ALB/NLB. Keep ASR and ordinary API on separate hostnames when possible.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format viva_json escape=json
      '{"time":"$time_iso8601","request_id":"$request_id",'
      '"remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
      '"uri":"$uri","status":$status,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time","bytes":$bytes_sent}';

    access_log /var/log/nginx/access.log viva_json;
    error_log  /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream viva_api {
        least_conn;
        server api:8080 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    upstream viva_gateway {
        least_conn;
        server gateway:8081 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    # Reject unknown SNI/Host before it can influence routing, DPoP URL
    # reconstruction or cache keys.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Ordinary HTTPS and SSE API.
    server {
        listen 443 ssl http2;
        server_name api.example.cn;

        ssl_certificate     /run/secrets/tls_fullchain.pem;
        ssl_certificate_key /run/secrets/tls_private_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 1m;
        client_body_timeout 10s;
        keepalive_timeout 30s;

        location = /healthz {
            proxy_pass http://viva_api;
            proxy_set_header Host $server_name;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://viva_api;
            proxy_set_header Host $server_name;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }

        location = /v1/text/polish/stream {
            proxy_pass http://viva_api;
            proxy_http_version 1.1;
            proxy_set_header Host $server_name;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            gzip off;
            # This location has its own add_header, so repeat the server-level
            # security header because Nginx add_header inheritance is replaced.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Accel-Buffering no always;
        }

        location / {
            proxy_pass http://viva_api;
            proxy_http_version 1.1;
            proxy_set_header Host $server_name;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }

    # Dedicated low-latency WSS hostname.
    server {
        listen 443 ssl;
        server_name voice.api.example.cn;

        ssl_certificate     /run/secrets/tls_fullchain.pem;
        ssl_certificate_key /run/secrets/tls_private_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Upgrade requests should not carry a body. This is only an HTTP
        # handshake limit; WebSocket frame limits remain in the Go Gateway.
        client_max_body_size 16k;
        client_body_timeout 5s;
        keepalive_timeout 120s;

        location = /healthz {
            proxy_pass http://viva_gateway;
            proxy_set_header Host $server_name;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://viva_gateway;
            proxy_set_header Host $server_name;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }

        location = /v1/asr/stream {
            proxy_pass http://viva_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $server_name;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;

            # The Go Gateway must control WebSocket compression explicitly.
            proxy_set_header Sec-WebSocket-Extensions "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            return 404;
        }
    }
}
