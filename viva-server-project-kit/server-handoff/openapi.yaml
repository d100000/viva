        state: {type: string}
        lease_expires_at: {type: string, format: date-time}

    DiagnosticReportRequest:
      type: object
      additionalProperties: false
      required: [client_version, os_version, architecture, category, events, consent]
      properties:
        client_version: {type: string, maxLength: 32}
        os_version: {type: string, maxLength: 32}
        architecture: {type: string, maxLength: 32}
        category: {type: string, enum: [auth, asr_connect, asr_result, polish, billing, other]}
        session_id: {type: string, format: uuid, nullable: true}
        events:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [time, code]
            properties:
              time: {type: string, format: date-time}
              code: {type: string, maxLength: 64}
              duration_ms: {type: integer, minimum: 0}
              metadata:
                type: object
                additionalProperties: true
                description: Must be redacted and schema-filtered server-side.
        consent:
          type: object
          additionalProperties: false
          required: [contains_audio, contains_transcript]
          properties:
            contains_audio: {type: boolean, enum: [false]}
            contains_transcript: {type: boolean, enum: [false]}

    DiagnosticUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, content_type, size_bytes, sha256, explicit_consent]
      properties:
        file_name: {type: string, maxLength: 120}
        content_type: {type: string, enum: [application/zip, audio/wav, audio/x-wav, text/plain]}
        size_bytes: {type: integer, format: int64, minimum: 1, maximum: 10485760}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        contains_audio: {type: boolean, default: false}
        contains_transcript: {type: boolean, default: false}
        explicit_consent: {type: boolean, enum: [true]}

    DiagnosticUploadResponse:
      type: object
      additionalProperties: false
      required: [upload_id, method, upload_url, required_headers, expires_at, object_expires_at]
