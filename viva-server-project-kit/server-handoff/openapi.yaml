        endpoint: {type: string, format: uri}
        resource_id: {type: string, maxLength: 255, nullable: true}
        model_alias: {type: string, maxLength: 128, nullable: true}
        secret_ref: {type: string, minLength: 3, maxLength: 1024}
        secret_version: {type: string, maxLength: 128, nullable: true}
        max_concurrency: {type: integer, minimum: 1, nullable: true}
        reason: {type: string, minLength: 3, maxLength: 1000}
        ticket_id: {type: string, maxLength: 128}

    ProviderAccount:
      type: object
