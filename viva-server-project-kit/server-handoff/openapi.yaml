openapi: 3.0.3
info:
  title: Viva Managed Server API
  version: 1.0.0
  description: |
    Viva macOS 托管语音服务的控制面、用户、计费、润色和管理 API。
    实时 SAUC WebSocket 的消息定义同时参考 asyncapi.yaml。
  contact:
    name: Viva Server Team
servers:
  - url: https://api.example.cn
    description: Production placeholder
  - url: https://staging-api.example.cn
    description: Staging placeholder
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Devices
  - name: Privacy
  - name: Realtime
  - name: Polish
  - name: Usage
  - name: Billing
  - name: Diagnostics
  - name: Admin

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 是否接受新流量
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /.well-known/jwks.json:
    get:
      tags: [System]
      operationId: getJwks
      summary: Access Token 验签公钥
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSet'

  /v1/service/status:
    get:
      tags: [System]
      operationId: getServiceStatus
      summary: 服务、维护和上游状态
      security: []
      responses:
        '200':
          description: Current service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'

  /v1/client/config:
    get:
      tags: [System]
      operationId: getClientConfig
      summary: 获取签名的客户端远程配置和能力
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ProtocolVersionHeader'
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Effective client configuration
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
        '304':
          description: Not modified
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/client/bootstrap:
    post:
      tags: [Auth]
      operationId: bootstrapClient
      summary: 创建或恢复受限 guest 用户和设备
      description: |
        不使用 Access Token。请求必须携带包含 public JWK 的 bootstrap DPoP proof，
        且 Proof JWK 必须和 body 中的 device_key 一致。
      security:
        - TokenEndpointDPoPProof: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ProtocolVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Guest and device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '200':
          description: Existing installation recovered idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestEmailOtp
      summary: 请求邮箱验证码
      description: 无论邮箱是否存在都返回 202，避免账号枚举。无 Access Token，但必须用设备 P-256 key 提交 Token Endpoint DPoP proof，供设备级防刷。
      security:
        - TokenEndpointDPoPProof: []
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyEmailOtp
      summary: 邮箱 OTP 登录或升级当前 guest
      description: 可以不带 Access Token 登录；带 guest DPoP Access Token 时将当前 guest 升级为 registered。
      security:
        - TokenEndpointDPoPProof: []
        - DPoPAccessToken: []
          DPoPProof: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/oidc/exchange:
    post:
      tags: [Auth]
      operationId: exchangeOidcToken
      summary: Apple/OIDC 登录或绑定
      security:
        - TokenEndpointDPoPProof: []
        - DPoPAccessToken: []
          DPoPProof: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcExchangeRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 旋转 Refresh Token 并获取新 Access Token
      security:
        - TokenEndpointDPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Refresh Token reuse detected; the token family was revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutCurrentDevice
      summary: 撤销当前 Refresh Token family
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAllDevices
      summary: 撤销全部设备 Token
      description: Access Token 的 auth_time 必须在 5 分钟内，且 amr 包含 otp、oidc 或 passkey；否则返回 RECENT_AUTH_REQUIRED。
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      responses:
        '204':
          description: All token families revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 当前用户、账户状态和权益摘要
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: 更新可编辑资料
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/consents:
    put:
      tags: [Users]
      operationId: updateConsents
      summary: 接受用户协议和隐私政策版本
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Updated consent state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: 当前用户的设备列表
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'

  /v1/devices/{device_id}:
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: 撤销设备和其 Refresh Token family
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/DeviceIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '204':
          description: Device revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/privacy/exports:
    post:
      tags: [Privacy]
      operationId: createPrivacyExport
      summary: 创建个人数据导出任务
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyExportRequest'
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'

  /v1/privacy/exports/{request_id}:
    get:
      tags: [Privacy]
      operationId: getPrivacyExport
      summary: 查询导出状态
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/privacy/deletions:
    post:
      tags: [Privacy]
      operationId: createPrivacyDeletion
      summary: 创建账号注销与数据删除任务
      description: Access Token 的 auth_time 必须在 5 分钟内，且 amr 包含 otp、oidc 或 passkey；否则返回 RECENT_AUTH_REQUIRED。
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyDeletionRequest'
      responses:
        '202':
          description: Deletion queued with grace period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/privacy/deletions/{request_id}:
    delete:
      tags: [Privacy]
      operationId: cancelPrivacyDeletion
      summary: 在宽限期内取消注销
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '204':
          description: Deletion cancelled
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/asr/stream:
    get:
      tags: [Realtime]
      operationId: upgradeAsrStream
      summary: 升级为 SAUC 透明代理 WebSocket
      description: 实际服务域名为 voice.api.example.cn；消息契约见 asyncapi.yaml。
      servers:
        - url: https://voice.api.example.cn
          description: Production HTTPS opening-handshake origin; the client connects with wss.
        - url: https://staging-voice.api.example.cn
          description: Staging HTTPS opening-handshake origin; the client connects with wss.
      x-websocket-url: wss://voice.api.example.cn/v1/asr/stream
      x-dpop-htu: https://voice.api.example.cn/v1/asr/stream
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ProtocolVersionHeader'
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: 首版必须且只能发送唯一值 viva.sauc.v1。
          schema:
            type: string
            enum: [viva.sauc.v1]
      x-websocket-protocol: viva.sauc.v1
      x-asyncapi-file: ./asyncapi.yaml
      responses:
        '101':
          description: Switching Protocols
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/text/polish:
    post:
      tags: [Polish]
      operationId: polishText
      summary: 非流式产品专用文本润色
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolishRequest'
      responses:
        '200':
          description: Polished text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolishResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/text/polish/stream:
    post:
      tags: [Polish]
      operationId: streamPolishText
      summary: SSE 产品专用文本润色
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolishRequest'
      responses:
        '200':
          description: "Server-Sent Events stream: meta, delta, final, usage, done or error"
          headers:
            Cache-Control:
              schema: {type: string, example: no-cache}
            X-Accel-Buffering:
              schema: {type: string, example: 'no'}
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/usage/summary:
    get:
      tags: [Usage]
      operationId: getUsageSummary
      summary: 当前账期额度、已用、预留和重置时间
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/usage/sessions:
    get:
      tags: [Usage]
      operationId: listUsageSessions
      summary: 脱敏的 ASR/LLM 会话元数据
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: kind
          in: query
          schema:
            type: string
            enum: [asr, llm]
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSessionPage'

  /v1/billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      summary: 当前可购买套餐
      security: []
      parameters:
        - name: locale
          in: query
          schema: {type: string, default: zh-CN}
      responses:
        '200':
          description: Active plan versions
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [items, price_version]
                properties:
                  price_version: {type: string}
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'

  /v1/billing/subscription:
    get:
      tags: [Billing]
      operationId: getSubscription
      summary: 当前订阅和权益
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: Subscription or free entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /v1/billing/orders:
    post:
      tags: [Billing]
      operationId: createBillingOrder
      summary: 创建支付订单
      description: 仅 registered 用户；金额和 plan version 由服务端计算。
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order and checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/billing/orders/{order_id}:
    get:
      tags: [Billing]
      operationId: getBillingOrder
      summary: 查询当前用户订单
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/billing/orders/{order_id}/cancel:
    post:
      tags: [Billing]
      operationId: cancelBillingOrder
      summary: 取消未支付订单
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOrder'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/billing/subscription/cancel:
    post:
      tags: [Billing]
      operationId: cancelSubscription
      summary: 期末取消订阅
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /v1/billing/subscription/resume:
    post:
      tags: [Billing]
      operationId: resumeSubscription
      summary: 恢复期末取消
      security:
        - DPoPAccessToken: []
          DPoPProof: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /v1/webhooks/payments/{provider}:
    post:
      tags: [Billing]
      operationId: receivePaymentWebhook
      summary: 支付 Provider Webhook
      security:
        - PaymentSignature: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
