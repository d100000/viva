components:
  securitySchemes:
    DPoPAccessToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'RFC 9449 token-bound authorization header: Authorization: DPoP <short-lived Viva Access Token>.'
    DPoPProof:
      type: apiKey
      in: header
      name: DPoP
      description: RFC 9449 proof bound to the Access Token device key.
    TokenEndpointDPoPProof:
      type: apiKey
      in: header
      name: DPoP
      description: RFC 9449 proof for token-issuing endpoints. No Authorization header or ath claim is required; the public JWK must identify the device key.
    AdminBearerAuth:
      type: oauth2
      description: >-
        Enterprise OIDC token with audience viva-admin and MFA. Scope issuance is
        cumulative by policy: support_agent also carries support_readonly;
        billing_admin and security_admin also carry support_readonly; the
        break-glass super_admin token carries all listed scopes.
      flows:
        authorizationCode:
          authorizationUrl: https://admin-idp.example.cn/oauth2/authorize
          tokenUrl: https://admin-idp.example.cn/oauth2/token
          scopes:
            support_readonly: Read redacted support data
            support_agent: Revoke devices and perform support actions
            billing_admin: Manage plans, orders and quota adjustments
            security_admin: Suspend users and read audit logs
            platform_admin: Manage config and provider operations
    PaymentSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: Placeholder; each provider adapter validates its official signature headers and raw body.

  parameters:
    DeviceIdHeader:
      name: X-Viva-Device-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ClientVersionHeader:
      name: X-Viva-Client-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$'
    ProtocolVersionHeader:
      name: X-Viva-Protocol-Version
      in: header
      required: true
      schema:
        type: integer
        enum: [1]
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CursorQuery:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DeviceIdPath:
      name: device_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequestIdPath:
      name: request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderIdPath:
      name: order_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RefundIdPath:
      name: refund_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProviderIdPath:
      name: provider_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    BadRequest:
      description: Invalid request or protocol
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or token expired
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found within the authenticated subject scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate, quota or concurrency limit reached
      headers:
        Retry-After:
          schema: {type: integer, minimum: 0}
        RateLimit-Limit:
          schema: {type: integer, minimum: 0}
        RateLimit-Remaining:
          schema: {type: integer, minimum: 0}
        RateLimit-Reset:
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream provider failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Maintenance, provider capacity or service overload
      headers:
        Retry-After:
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Upstream timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, time]
      properties:
        status:
          type: string
          enum: [ok, draining, unavailable]
        time:
          type: string
          format: date-time
        version:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          example: QUOTA_EXHAUSTED
        message:
          type: string
          maxLength: 500
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        retry_after_ms:
          type: integer
          minimum: 0
          nullable: true
        details:
          type: object
          additionalProperties: true

    JWKSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true

    ServiceStatus:
      type: object
      additionalProperties: false
      required: [status, updated_at, components]
      properties:
        status:
          type: string
          enum: [operational, degraded, maintenance, outage]
        message:
          type: string
          maxLength: 500
        updated_at:
          type: string
          format: date-time
        retry_after_ms:
          type: integer
          minimum: 0
          nullable: true
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: {type: string}
              status:
                type: string
                enum: [operational, degraded, maintenance, outage]

    ClientConfig:
      type: object
      additionalProperties: false
      required: [version, expires_at, minimum_client_version, protocol_version, asr, polish, privacy, signature]
      properties:
        version: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
        minimum_client_version: {type: string}
        protocol_version: {type: integer, enum: [1]}
        asr:
          type: object
          additionalProperties: false
          required: [websocket_url, sample_rate, bits, channels, recommended_chunk_ms, max_session_ms, gateway_absolute_session_ms]
          properties:
            websocket_url: {type: string, format: uri}
            sample_rate: {type: integer, enum: [16000]}
            bits: {type: integer, enum: [16]}
            channels: {type: integer, enum: [1]}
            recommended_chunk_ms: {type: integer, enum: [200]}
            first_chunk_ms: {type: integer, enum: [100, 200]}
            max_session_ms: {type: integer, minimum: 1000, maximum: 75000, description: Maximum product-plan session duration.}
            gateway_absolute_session_ms: {type: integer, enum: [90000], description: Non-entitlement safety ceiling enforced by Gateway.}
            end_window_min_ms: {type: integer, minimum: 200}
            end_window_max_ms: {type: integer, maximum: 3000}
        polish:
          type: object
          additionalProperties: false
          required: [enabled, modes, model_tiers, max_input_chars]
          properties:
            enabled: {type: boolean}
            modes:
              type: array
              items: {type: string, enum: [polish, course_correction, both]}
            model_tiers:
              type: array
              items: {type: string}
            max_input_chars: {type: integer, minimum: 1, maximum: 16000}
        privacy:
          type: object
          additionalProperties: false
          required: [audio_stored, transcript_stored, metadata_retention_days]
          properties:
            audio_stored: {type: boolean, enum: [false]}
            transcript_stored: {type: boolean, enum: [false]}
            metadata_retention_days: {type: integer, minimum: 0}
        feature_flags:
          type: object
          additionalProperties: true
        signature:
          type: string
          description: Base64url Ed25519/ES256 signature over canonical configuration.

    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [install_id, device, device_key, locale, timezone]
      properties:
        install_id:
          type: string
          format: uuid
        device:
          type: object
          additionalProperties: false
          required: [platform, app_version, protocol_version]
          properties:
            name: {type: string, maxLength: 120}
            platform: {type: string, enum: [macos]}
            os_version: {type: string, maxLength: 32}
            app_version: {type: string, maxLength: 32}
            protocol_version: {type: integer, enum: [1]}
            architecture: {type: string, enum: [arm64, x86_64]}
            assurance_level: {type: string, enum: [secure_enclave, keychain]}
        device_key:
          $ref: '#/components/schemas/PublicJWK'
        locale: {type: string, maxLength: 16}
        timezone: {type: string, maxLength: 64}

    PublicJWK:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      properties:
        kty: {type: string, enum: [EC]}
        crv: {type: string, enum: [P-256]}
        x: {type: string, minLength: 40, maxLength: 100}
        y: {type: string, minLength: 40, maxLength: 100}

    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [user, device, tokens, entitlement]
      properties:
        user:
          $ref: '#/components/schemas/User'
        device:
          $ref: '#/components/schemas/Device'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        entitlement:
          $ref: '#/components/schemas/Entitlement'

    OtpRequest:
      type: object
      additionalProperties: false
      required: [email, purpose, locale]
      properties:
        email: {type: string, format: email, maxLength: 254}
        purpose: {type: string, enum: [login, register, recent_auth]}
        locale: {type: string, maxLength: 16}

    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [request_id, accepted_at]
      properties:
        request_id: {type: string, format: uuid}
        accepted_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}

    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code, device_key]
      properties:
        challenge_id: {type: string, format: uuid}
        code: {type: string, pattern: '^\d{6}$'}
        device_key:
          $ref: '#/components/schemas/PublicJWK'

    OidcExchangeRequest:
      type: object
      additionalProperties: false
      required: [provider, id_token, nonce, device_key]
      properties:
        provider: {type: string, enum: [apple]}
        id_token: {type: string, minLength: 20, maxLength: 16384}
        authorization_code: {type: string, maxLength: 4096}
        redirect_uri: {type: string, format: uri}
        nonce: {type: string, minLength: 16, maxLength: 255}
        device_key:
          $ref: '#/components/schemas/PublicJWK'

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          pattern: '^vvr_[A-Za-z0-9_-]{32,256}$'

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          pattern: '^vvr_[A-Za-z0-9_-]{32,256}$'

    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [user, device, tokens, entitlement]
      properties:
        user:
          $ref: '#/components/schemas/User'
        device:
          $ref: '#/components/schemas/Device'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        entitlement:
          $ref: '#/components/schemas/Entitlement'

    AuthTokens:
      type: object
      additionalProperties: false
      required: [token_type, access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        token_type: {type: string, enum: [DPoP]}
        access_token: {type: string, minLength: 20}
        access_expires_at: {type: string, format: date-time}
        refresh_token:
          type: string
          pattern: '^vvr_[A-Za-z0-9_-]{32,256}$'
        refresh_expires_at: {type: string, format: date-time}

    User:
      type: object
      additionalProperties: false
      required: [id, account_type, status, locale, timezone, created_at]
      properties:
        id: {type: string, format: uuid}
        account_type: {type: string, enum: [guest, registered]}
        status: {type: string, enum: [active, suspended, deletion_pending, deleted]}
        display_name: {type: string, maxLength: 80, nullable: true}
        masked_email: {type: string, nullable: true, example: 'b***@example.com'}
        locale: {type: string, maxLength: 16}
        timezone: {type: string, maxLength: 64}
        terms_version: {type: string, nullable: true}
        privacy_version: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    Device:
      type: object
      additionalProperties: false
      required: [id, platform, app_version, protocol_version, assurance_level, status, first_seen_at, last_seen_at, current]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 120, nullable: true}
        platform: {type: string, enum: [macos]}
        app_version: {type: string}
        protocol_version: {type: integer, enum: [1]}
        os_version: {type: string, nullable: true}
        architecture: {type: string, nullable: true}
        assurance_level: {type: string, enum: [secure_enclave, keychain]}
        status: {type: string, enum: [active, revoked]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        current: {type: boolean}

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, entitlement, current_device]
      properties:
        user:
          $ref: '#/components/schemas/User'
        entitlement:
          $ref: '#/components/schemas/Entitlement'
        current_device:
          $ref: '#/components/schemas/Device'
        subscription:
          $ref: '#/components/schemas/Subscription'

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: string, maxLength: 80, nullable: true}
        locale: {type: string, maxLength: 16}
        timezone: {type: string, maxLength: 64}

    ConsentRequest:
      type: object
      additionalProperties: false
      required: [terms_version, privacy_version, accepted]
      properties:
        terms_version: {type: string, maxLength: 32}
        privacy_version: {type: string, maxLength: 32}
        accepted: {type: boolean, enum: [true]}

    Entitlement:
      type: object
      additionalProperties: false
      required: [plan_code, plan_version, period_start, period_end, asr_audio_ms_limit, asr_audio_ms_used, asr_audio_ms_reserved, max_asr_concurrency, max_session_ms, polish_enabled, allowed_model_tiers]
      properties:
        plan_code: {type: string}
        plan_version: {type: integer, minimum: 1}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        asr_audio_ms_limit: {type: integer, format: int64, minimum: 0}
        asr_audio_ms_used: {type: integer, format: int64, minimum: 0}
        asr_audio_ms_reserved: {type: integer, format: int64, minimum: 0}
        max_asr_concurrency: {type: integer, minimum: 1}
        max_session_ms: {type: integer, minimum: 1000, maximum: 75000, description: Effective product-plan session duration.}
        polish_enabled: {type: boolean}
        allowed_model_tiers:
          type: array
          items: {type: string}
        llm_input_tokens_limit: {type: integer, format: int64, minimum: 0}
        llm_input_tokens_used: {type: integer, format: int64, minimum: 0}
        llm_output_tokens_limit: {type: integer, format: int64, minimum: 0}
        llm_output_tokens_used: {type: integer, format: int64, minimum: 0}

    PrivacyExportRequest:
      type: object
      additionalProperties: false
      properties:
        format: {type: string, enum: [zip_json], default: zip_json}

    PrivacyDeletionRequest:
      type: object
      additionalProperties: false
      required: [reason, confirm]
      properties:
        reason: {type: string, maxLength: 500}
        confirm: {type: string, enum: [DELETE_MY_ACCOUNT]}

    PrivacyRequest:
      type: object
      additionalProperties: false
      required: [id, kind, status, requested_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [export, deletion]}
        status: {type: string, enum: [requested, processing, ready, completed, cancelled, failed]}
        requested_at: {type: string, format: date-time}
        grace_expires_at: {type: string, format: date-time, nullable: true}
        download_url: {type: string, format: uri, nullable: true}
        download_expires_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        error_code: {type: string, nullable: true}

    PolishRequest:
      type: object
      additionalProperties: false
      required: [request_id, text, mode, model_tier, locale, prompt_version]
      properties:
        request_id: {type: string, format: uuid}
        text:
          type: string
          minLength: 1
          maxLength: 16000
        mode:
          type: string
          enum: [polish, course_correction, both]
        model_tier:
          type: string
          enum: [fast, quality]
        locale: {type: string, maxLength: 16, default: zh-CN}
        prompt_version: {type: string, maxLength: 64}
        app_context:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            bundle_id: {type: string, maxLength: 255}
            category: {type: string, enum: [chat, document, code, email, browser, other]}
        replacement_hints:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: {type: string, minLength: 1, maxLength: 80}
              to: {type: string, minLength: 1, maxLength: 80}

    PolishResponse:
      type: object
      additionalProperties: false
      required: [id, text, mode, model_tier, prompt_version, elapsed_ms, usage]
      properties:
        id: {type: string, format: uuid}
        text: {type: string}
        mode: {type: string, enum: [polish, course_correction, both]}
        model_tier: {type: string}
        prompt_version: {type: string}
        elapsed_ms: {type: integer, minimum: 0}
        usage:
          $ref: '#/components/schemas/LlmUsage'

    LlmUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, estimated]
      properties:
        input_tokens: {type: integer, format: int64, minimum: 0}
        output_tokens: {type: integer, format: int64, minimum: 0}
        estimated: {type: boolean}

    UsageSummary:
      type: object
      additionalProperties: false
      required: [period_start, period_end, resources]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        resources:
          type: array
          items:
            $ref: '#/components/schemas/UsageResource'

    UsageResource:
      type: object
      additionalProperties: false
      required: [resource, unit, limit, used, reserved, remaining]
      properties:
        resource: {type: string, example: asr_audio_ms}
        unit: {type: string, example: ms}
        limit: {type: integer, format: int64, minimum: 0}
        used: {type: integer, format: int64, minimum: 0}
        reserved: {type: integer, format: int64, minimum: 0}
        remaining: {type: integer, format: int64, minimum: 0}

    UsageSessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageSession'
        next_cursor: {type: string, nullable: true}

    UsageSession:
      type: object
      additionalProperties: false
      required: [id, kind, status, started_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [asr, llm]}
        status: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        duration_ms: {type: integer, format: int64, minimum: 0, nullable: true}
        audio_ms: {type: integer, format: int64, minimum: 0, nullable: true}
        input_tokens: {type: integer, format: int64, minimum: 0, nullable: true}
        output_tokens: {type: integer, format: int64, minimum: 0, nullable: true}
        client_version: {type: string, nullable: true}
        first_partial_ms: {type: integer, minimum: 0, nullable: true}
        upstream_connect_ms: {type: integer, minimum: 0, nullable: true}
        error_code: {type: string, nullable: true}
        upstream_log_id: {type: string, nullable: true, description: Only exposed to the owner or authorized support role.}

    BillingPlan:
      type: object
      additionalProperties: false
      required: [id, code, version, display_name, currency, price_minor, billing_interval, entitlement, status]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        version: {type: integer, minimum: 1}
        display_name: {type: string}
        description: {type: string, nullable: true}
        currency: {type: string, minLength: 3, maxLength: 3}
        price_minor: {type: integer, format: int64, minimum: 0}
        billing_interval: {type: string, enum: [one_time, month, year]}
        entitlement:
          type: object
          additionalProperties: true
        status: {type: string, enum: [draft, active, retired]}
        effective_from: {type: string, format: date-time}
        sales_end_at: {type: string, format: date-time, nullable: true}

    Subscription:
      type: object
      additionalProperties: false
      required: [id, plan, status, current_period_start, current_period_end, cancel_at_period_end]
      properties:
        id: {type: string, format: uuid}
        plan:
          $ref: '#/components/schemas/BillingPlan'
        status: {type: string, enum: [trialing, active, past_due, paused, cancelled, expired]}
        current_period_start: {type: string, format: date-time}
        current_period_end: {type: string, format: date-time}
        cancel_at_period_end: {type: boolean}
        cancelled_at: {type: string, format: date-time, nullable: true}

    SubscriptionResponse:
      type: object
      additionalProperties: false
      required: [entitlement]
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
        entitlement:
          $ref: '#/components/schemas/Entitlement'

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [plan_code, provider, return_url]
      properties:
        plan_code: {type: string, maxLength: 64}
        provider: {type: string, pattern: '^[a-z0-9_-]{2,32}$'}
        return_url: {type: string, format: uri}

    BillingOrder:
      type: object
      additionalProperties: false
      required: [id, status, plan, provider, currency, amount_minor, refunded_amount_minor, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [created, pending_payment, paid, fulfilled, cancelled, expired, refund_pending, partially_refunded, refunded, refund_failed]}
        plan:
          $ref: '#/components/schemas/BillingPlan'
        provider: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3}
        amount_minor: {type: integer, format: int64, minimum: 0}
        refunded_amount_minor: {type: integer, format: int64, minimum: 0}
        checkout_url: {type: string, format: uri, nullable: true}
        qr_code_url: {type: string, format: uri, nullable: true}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        paid_at: {type: string, format: date-time, nullable: true}
        fulfilled_at: {type: string, format: date-time, nullable: true}

    BillingOrderPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingOrder'
        next_cursor: {type: string, nullable: true}

    AdminRefundRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, reason, ticket_id]
      properties:
        amount_minor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 3, maxLength: 1000}
        ticket_id: {type: string, maxLength: 128}

    BillingRefund:
      type: object
      additionalProperties: false
      required: [id, order_id, status, currency, amount_minor, reason, ticket_id, created_at]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        status: {type: string, enum: [requested, pending, succeeded, failed, cancelled]}
        currency: {type: string, minLength: 3, maxLength: 3}
        amount_minor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, maxLength: 1000}
        ticket_id: {type: string, maxLength: 128}
        provider_refund_id: {type: string, nullable: true}
        failure_code: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}

    SubscriptionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        next_cursor: {type: string, nullable: true}

    ProviderAccountRequest:
      type: object
      additionalProperties: false
      required: [provider, purpose, region, endpoint, secret_ref, reason, ticket_id]
      properties:
        provider: {type: string, enum: [volc_asr, volc_ark, mock_asr, mock_llm]}
        purpose: {type: string, enum: [asr, llm]}
